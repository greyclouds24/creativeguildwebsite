<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creative Guild Games — Blog</title>
    <link rel="stylesheet" href="styles.css?v=20261027l" />
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-inner">
            <div class="brand">
                <span class="brand-mark"></span>
                <span class="brand-text">Creative Guild LLC</span>
            </div>

            <nav class="nav-items">
                <a class="nav-item" href="index.html">Home</a>
                <a class="nav-item" href="our-games.html">Our Games</a>
                <a class="nav-item" href="about-us.html">About Us</a>
                <a class="nav-item active" href="blog.html">Blog</a>
            </nav>

            <div class="nav-actions">
                <button class="projects-btn" onclick="window.location.href='help-wanted.html'">
                    <strong>Ongoing Projects</strong>
                    <span>Apply to help us out!</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="profile-section">
            <h1 class="title-bordered">Blog</h1>
            <p class="subtitle">Studio Announcements - Project Updates - Other News</p>
        </section>

        <section class="portfolio" id="blog-panel">
            <div class="blog-layout">
                <div class="blog-column">
                    <div class="blog-tools">
                        <div class="blog-search-stack">
                            <button class="blog-asset-toggle" id="blog-asset-toggle" type="button" aria-pressed="false">Asset Search</button>
                            <label class="blog-search">
                                <span class="blog-tool-label">Search</span>
                                <input id="blog-search" type="search" placeholder="Search posts" autocomplete="off" />
                            </label>
                        </div>
                        <label class="blog-sort">
                            <span class="blog-tool-label">Date</span>
                            <select id="blog-sort">
                                <option value="newest">Newest</option>
                                <option value="oldest">Oldest</option>
                            </select>
                        </label>
                        <div class="blog-tag-filters" id="blog-tag-filters" aria-label="Filter by tag"></div>
                    </div>
                    <div class="asset-panel" id="asset-panel" hidden>
                        <label class="blog-search">
                            <span class="blog-tool-label">Asset tags</span>
                            <input id="asset-search" type="search" placeholder="Search asset tags" autocomplete="off" />
                        </label>
                        <div class="blog-tag-filters" id="asset-tag-filters" aria-label="Filter assets by tag"></div>
                        <div class="asset-results" id="asset-results"></div>
                    </div>
                    <div class="blog-list" id="blog-list">
                        <p class="blog-status">Loading posts...</p>
                    </div>
                    <nav class="blog-pager" id="blog-pager" aria-label="Blog pages" hidden></nav>
                </div>
                <aside class="blog-rail" id="blog-rail" aria-label="Studio promotions"></aside>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <span class="site-version">v2.2</span>
    </footer>

    <script src="assets/marked.min.js"></script>
    <script>
        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const parts = String(dateString).split('-');
            if (parts.length < 3) return escapeHtml(dateString);
            const date = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
            if (Number.isNaN(date.getTime())) return escapeHtml(dateString);
            return date.toLocaleDateString(undefined, {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        const PAGE_SIZE = 10;
        const BLOG_PROMOS = [{
            href: 'https://store.steampowered.com/app/3937580/Manipulation/',
            image: 'assets/images/manipulation_library_capsule.jpg',
            wideImage: 'assets/images/horizontal_capsule.png',
            alt: 'Manipulation',
            label: 'play now!',
            wideLabel: 'Play Now'
        }];
        let allPosts = [];
        let activeTag = '';
        let activeAssetTag = '';
        let assetMode = false;
        let currentPage = 1;

        function picturePattern() {
            return /!pic\{"([^"]+)"\}(?:\["([^"]*)"\])?((?:#[A-Za-z0-9][A-Za-z0-9-]*)*)/g;
        }

        function pictureTags(raw) {
            const found = String(raw || '').split('#').map((tag) => tag.trim()).filter(Boolean);
            const tags = [];
            const seen = new Set();
            found.concat('asset').forEach((tag) => {
                const key = tag.toLowerCase();
                if (seen.has(key)) return;
                seen.add(key);
                tags.push(tag);
            });
            return tags;
        }

        function collectPictures(markdown, postId) {
            const assets = [];
            for (const match of String(markdown || '').matchAll(picturePattern())) {
                assets.push({
                    id: `${postId}-${assets.length}`,
                    src: String(match[1]).trim(),
                    description: match[2] ? String(match[2]).trim() : '',
                    tags: pictureTags(match[3])
                });
            }
            return assets;
        }

        function promoMarkup(kind) {
            return BLOG_PROMOS.map((promo) => {
                const src = kind === 'blog-ad-sliver' ? promo.wideImage : promo.image;
                const text = kind === 'blog-ad-sliver' ? promo.wideLabel : promo.label;
                const label = `<span class="blog-ad-label">${escapeHtml(text)}</span>`;
                return `
                <a class="blog-ad ${kind}" href="${escapeHtml(promo.href)}" target="_blank" rel="noopener noreferrer">
                    <img src="${escapeHtml(src)}" alt="${escapeHtml(promo.alt)}" />
                    ${label}
                </a>
            `;
            }).join('');
        }

        function tagLabel(tag) {
            return String(tag).replace(/-/g, ' ');
        }

        function postTags(post) {
            return Array.isArray(post.tags) ? post.tags.filter(Boolean) : [];
        }

        function postTime(post) {
            const time = Date.parse(post.datePublished);
            return Number.isNaN(time) ? 0 : time;
        }

        function postSearchText(post) {
            const content = document.createElement('div');
            content.innerHTML = post.content || '';
            return [
                post.title,
                post.excerpt,
                post.category,
                postTags(post).map(tagLabel).join(' '),
                content.textContent
            ].join(' ').toLowerCase();
        }

        function renderTagFilters() {
            const filters = document.getElementById('blog-tag-filters');
            const tags = [...new Set(allPosts.flatMap(postTags))].sort((a, b) =>
                tagLabel(a).localeCompare(tagLabel(b))
            );
            const chips = ['', ...tags].map((tag) => {
                const selected = tag === activeTag;
                const label = tag ? tagLabel(tag) : 'All';
                return `<button class="blog-tag-filter${selected ? ' active' : ''}" type="button" data-tag="${escapeHtml(tag)}" aria-pressed="${selected ? 'true' : 'false'}">${escapeHtml(label)}</button>`;
            });
            filters.innerHTML = chips.join('');
            filters.querySelectorAll('.blog-tag-filter').forEach((button) => {
                button.addEventListener('click', () => {
                    activeTag = button.dataset.tag || '';
                    currentPage = 1;
                    renderBlog();
                });
            });
        }

        function visiblePosts() {
            const query = document.getElementById('blog-search').value.trim().toLowerCase();
            const sort = document.getElementById('blog-sort').value;
            const posts = allPosts.filter((post) => {
                const matchesTag = !activeTag || postTags(post).some((tag) => tag.toLowerCase() === activeTag.toLowerCase());
                const matchesQuery = !query || postSearchText(post).includes(query);
                return matchesTag && matchesQuery;
            });
            posts.sort((a, b) => sort === 'oldest' ? postTime(a) - postTime(b) : postTime(b) - postTime(a));
            return posts;
        }

        function renderPager(total) {
            const pager = document.getElementById('blog-pager');
            const pageCount = Math.ceil(total / PAGE_SIZE);
            if (pageCount <= 1) {
                pager.hidden = true;
                pager.innerHTML = '';
                return;
            }

            const start = (currentPage - 1) * PAGE_SIZE + 1;
            const end = Math.min(total, currentPage * PAGE_SIZE);
            const pages = Array.from({ length: pageCount }, (_, index) => index + 1).map((page) => {
                const selected = page === currentPage;
                return `<button class="blog-page${selected ? ' active' : ''}" type="button" data-page="${page}" aria-current="${selected ? 'page' : 'false'}">${page}</button>`;
            }).join('');

            pager.hidden = false;
            pager.innerHTML = `
                <p class="blog-page-status">Showing ${start}–${end} of ${total}</p>
                <div class="blog-page-controls">
                    <button class="blog-page" type="button" data-page="${currentPage - 1}" ${currentPage === 1 ? 'disabled' : ''}>Previous</button>
                    ${pages}
                    <button class="blog-page" type="button" data-page="${currentPage + 1}" ${currentPage === pageCount ? 'disabled' : ''}>Next</button>
                </div>
            `;
            pager.querySelectorAll('.blog-page').forEach((button) => {
                button.addEventListener('click', () => {
                    if (button.disabled) return;
                    currentPage = Number(button.dataset.page);
                    renderBlog();
                    document.getElementById('blog-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
            });
        }

        function renderBlog() {
            renderTagFilters();
            const list = document.getElementById('blog-list');
            const posts = visiblePosts();
            const pageCount = Math.max(1, Math.ceil(posts.length / PAGE_SIZE));
            if (currentPage > pageCount) currentPage = pageCount;
            if (currentPage < 1) currentPage = 1;
            if (!allPosts.length) {
                list.innerHTML = '<p class="blog-status">Nothing published yet.</p>';
                renderPager(0);
                applyAssetVisibility();
                return;
            }
            if (!posts.length) {
                list.innerHTML = '<p class="blog-status">No posts match that search.</p>';
                renderPager(0);
                applyAssetVisibility();
                return;
            }

            const pagePosts = posts.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
            const cards = pagePosts.map((post, index) => {
                const tags = postTags(post);
                const meta = [
                    formatDate(post.datePublished),
                    post.category,
                    post.readTime
                ].filter(Boolean).map(escapeHtml).join(' · ');

                return `
                    <article class="blog-card" id="post-${escapeHtml(post.id || index)}">
                        <div class="blog-card-header">
                            <div>
                                <h2>${escapeHtml(post.title || 'Untitled')}</h2>
                                <p class="blog-meta">${meta}</p>
                            </div>
                            <button class="blog-toggle" type="button" aria-expanded="false">Read</button>
                        </div>
                        ${tags.length ? `<div class="blog-tags">${tags.map((tag) => `<button class="blog-tag" type="button" data-tag="${escapeHtml(tag)}">${escapeHtml(tagLabel(tag))}</button>`).join('')}</div>` : ''}
                        <p class="blog-excerpt">${escapeHtml(post.excerpt || '')}</p>
                        <div class="blog-body">
                            ${post.content || ''}
                            <button class="blog-toggle blog-close" type="button">Close</button>
                        </div>
                    </article>
                `;
            });
            const sliver = promoMarkup('blog-ad-sliver');
            const bottomSliver = cards.length >= 4 ? sliver : '';
            if (cards.length === 1) {
                list.innerHTML = cards[0] + sliver;
            } else {
                list.innerHTML = cards[0] + sliver + cards.slice(1, -1).join('') + cards[cards.length - 1] + bottomSliver;
            }
            renderPager(posts.length);

            function setPostOpen(card, open) {
                card.classList.toggle('expanded', open);
                const toggle = card.querySelector('.blog-card-header .blog-toggle');
                if (toggle) {
                    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
                    toggle.textContent = open ? 'Close' : 'Read';
                }
            }

            function closePost(card) {
                setPostOpen(card, false);
                requestAnimationFrame(() => {
                    document.getElementById('blog-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
            }

            list.querySelectorAll('.blog-card-header .blog-toggle').forEach((button) => {
                button.addEventListener('click', () => {
                    const card = button.closest('.blog-card');
                    if (card.classList.contains('expanded')) closePost(card);
                    else setPostOpen(card, true);
                });
            });

            list.querySelectorAll('.blog-close').forEach((button) => {
                button.addEventListener('click', () => {
                    closePost(button.closest('.blog-card'));
                });
            });

            list.querySelectorAll('.blog-tag').forEach((button) => {
                button.addEventListener('click', () => {
                    activeTag = button.dataset.tag || '';
                    currentPage = 1;
                    renderBlog();
                });
            });
            applyAssetVisibility();
        }

        function wordCount(text) {
            const plain = String(text || '').replace(/<[^>]*>/g, ' ').trim();
            if (!plain) return 0;
            return plain.split(/\s+/).filter(Boolean).length;
        }

        function readingTime(words) {
            const count = Math.max(0, Number(words) || 0);
            const fast = Math.max(1, Math.ceil(count / 238));
            const slow = Math.max(1, Math.ceil(count / 200));
            if (fast === slow) return `${fast} min read`;
            return `${fast}–${slow} min read`;
        }

        function excerptFrom(html) {
            const plain = String(html || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
            if (plain.length <= 150) return plain;
            const cut = plain.slice(0, 150);
            const lastSpace = cut.lastIndexOf(' ');
            return (lastSpace > 0 ? cut.slice(0, lastSpace) : cut) + '...';
        }

        function blogPictures(markdown, assets) {
            const pictures = assets || [];
            let index = 0;
            return String(markdown || '').replace(picturePattern(), (_, file, description) => {
                const asset = pictures[index++] || {};
                const src = escapeHtml(String(file).trim());
                const alt = escapeHtml(description ? String(description).trim() : 'Blog image');
                const assetId = escapeHtml(asset.id || '');
                return `<figure class="blog-figure" id="asset-${assetId}" data-asset-id="${assetId}"><img src="${src}" alt="${alt}"></figure>`;
            });
        }

        function markdownToHtml(markdown, assets) {
            const html = marked.parse(blogPictures(markdown, assets), { gfm: true, breaks: false });
            return html
                .replace(/<table>/g, '<table class="blog-table">')
                .replace(/<blockquote>/g, '<blockquote class="blog-quote">')
                .replace(/<code>/g, '<code class="blog-code-inline">');
        }

        function parsePost(filename, markdown) {
            const lines = String(markdown || '').replace(/^\uFEFF/, '').split(/\r?\n/);
            const frontmatter = {};
            let bodyStart = 0;

            if (lines[0] && lines[0].trim() === '---') {
                let end = -1;
                for (let i = 1; i < lines.length; i++) {
                    if (lines[i].trim() === '---') {
                        end = i;
                        break;
                    }
                    const line = lines[i].trim();
                    if (!line || line.startsWith('#') || !line.includes(':')) continue;
                    const colon = line.indexOf(':');
                    const key = line.slice(0, colon).trim();
                    let value = line.slice(colon + 1).trim();
                    if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
                        value = value.slice(1, -1);
                    }
                    if (value.startsWith('[') && value.endsWith(']')) {
                        value = value.slice(1, -1).split(',').map(item => item.trim().replace(/['"]/g, '')).filter(Boolean);
                    } else if (value === 'true') {
                        value = true;
                    } else if (value === 'false') {
                        value = false;
                    } else if (value !== '' && !Number.isNaN(Number(value))) {
                        value = Number(value);
                    }
                    frontmatter[key] = value;
                }
                if (end >= 0) bodyStart = end + 1;
            }

            const body = lines.slice(bodyStart).join('\n').trim();
            if (!wordCount(body)) return null;

            const id = filename.replace(/\.md$/i, '').toLowerCase().replace(/[^a-z0-9]/g, '-');
            const assets = collectPictures(body, id);
            const content = markdownToHtml(body, assets);
            const words = wordCount(content);
            return {
                id,
                title: id,
                datePublished: new Date().toISOString().slice(0, 10),
                category: 'General',
                tags: [],
                ...frontmatter,
                wordCount: words,
                readTime: readingTime(words),
                excerpt: frontmatter.excerpt || excerptFrom(content),
                assets,
                content
            };
        }

        function allAssets() {
            return allPosts.flatMap((post) => (post.assets || []).map((asset) => ({
                ...asset,
                postId: post.id,
                postTitle: post.title || 'Untitled'
            })));
        }

        function visibleAssets() {
            const query = document.getElementById('asset-search').value.trim().toLowerCase();
            return allAssets().filter((asset) => {
                const tags = asset.tags.map((tag) => tag.toLowerCase());
                const labels = asset.tags.map((tag) => tagLabel(tag).toLowerCase());
                const matchesChip = !activeAssetTag || tags.includes(activeAssetTag.toLowerCase());
                const matchesQuery = !query || tags.some((tag) => tag.includes(query)) || labels.some((label) => label.includes(query));
                return matchesChip && matchesQuery;
            });
        }

        function renderAssetFilters() {
            const filters = document.getElementById('asset-tag-filters');
            const tags = [...new Set(allAssets().flatMap((asset) => asset.tags))].sort((a, b) =>
                tagLabel(a).localeCompare(tagLabel(b))
            );
            filters.innerHTML = ['', ...tags].map((tag) => {
                const selected = tag.toLowerCase() === activeAssetTag.toLowerCase();
                const label = tag || 'All';
                return `<button class="blog-tag-filter${selected ? ' active' : ''}" type="button" data-asset-tag="${escapeHtml(tag)}" aria-pressed="${selected ? 'true' : 'false'}">${escapeHtml(label)}</button>`;
            }).join('');
            filters.querySelectorAll('.blog-tag-filter').forEach((button) => {
                button.addEventListener('click', () => {
                    activeAssetTag = button.dataset.assetTag || '';
                    renderAssets();
                });
            });
        }

        function renderAssets() {
            renderAssetFilters();
            const results = document.getElementById('asset-results');
            const assets = visibleAssets();
            if (!assets.length) {
                results.innerHTML = '<p class="blog-status">No images match that search.</p>';
                return;
            }
            results.innerHTML = assets.map((asset) => `
                <button class="asset-card" type="button" data-asset-id="${escapeHtml(asset.id)}">
                    <img src="${escapeHtml(asset.src)}" alt="${escapeHtml(asset.description || asset.postTitle)}" />
                    <span class="asset-card-text">
                        <span class="asset-card-post">${escapeHtml(asset.postTitle)}</span>
                        ${asset.description ? `<span class="asset-card-description">${escapeHtml(asset.description)}</span>` : ''}
                        <span class="asset-card-tags">${asset.tags.map((tag) => `<span class="asset-card-tag">${escapeHtml(tag)}</span>`).join('')}</span>
                    </span>
                </button>
            `).join('');
            results.querySelectorAll('.asset-card').forEach((button) => {
                button.addEventListener('click', () => openAsset(button.dataset.assetId));
            });
        }

        function applyAssetVisibility() {
            const panel = document.getElementById('asset-panel');
            const list = document.getElementById('blog-list');
            const pager = document.getElementById('blog-pager');
            const button = document.getElementById('blog-asset-toggle');
            panel.hidden = !assetMode;
            list.hidden = assetMode;
            document.querySelectorAll('.blog-tools .blog-search, .blog-tools .blog-sort, #blog-tag-filters').forEach((control) => {
                control.hidden = assetMode;
            });
            if (assetMode) pager.hidden = true;
            button.textContent = assetMode ? 'Back to posts' : 'Asset Search';
            button.classList.toggle('active', assetMode);
            button.setAttribute('aria-pressed', assetMode ? 'true' : 'false');
        }

        function revealAsset(asset) {
            const figure = document.getElementById('asset-' + asset.id);
            const card = figure && figure.closest('.blog-card');
            if (!card) return;
            card.classList.add('expanded');
            const toggle = card.querySelector('.blog-card-header .blog-toggle');
            if (toggle) {
                toggle.setAttribute('aria-expanded', 'true');
                toggle.textContent = 'Close';
            }
            requestAnimationFrame(() => {
                figure.scrollIntoView({ behavior: 'smooth', block: 'center' });
            });
        }

        function openAsset(assetId) {
            const asset = allAssets().find((item) => item.id === assetId);
            if (!asset) return;
            assetMode = false;
            activeTag = '';
            activeAssetTag = '';
            document.getElementById('blog-search').value = '';
            document.getElementById('asset-search').value = '';
            const posts = visiblePosts();
            const index = posts.findIndex((post) => post.id === asset.postId);
            currentPage = index >= 0 ? Math.floor(index / PAGE_SIZE) + 1 : 1;
            renderBlog();
            revealAsset(asset);
        }

        async function listMarkdownFiles() {
            try {
                const response = await fetch('tpsiteitems/content/blogs/');
                if (response.ok) {
                    const listing = await response.text();
                    const names = [...listing.matchAll(/href="([^"]+)"/gi)]
                        .map(match => decodeURIComponent(match[1].split('/').pop().split('?')[0]))
                        .filter(name => name.toLowerCase().endsWith('.md'));
                    const unique = [...new Set(names)];
                    if (unique.length) return unique;
                }
            } catch (error) {
                console.warn(error);
            }

            const response = await fetch('https://api.github.com/repos/greyclouds24/creativeguildwebsite/contents/tpsiteitems/content/blogs', {
                headers: { Accept: 'application/vnd.github+json' }
            });
            if (!response.ok) throw new Error('Could not list blog posts');
            const entries = await response.json();
            return entries
                .filter(entry => entry.type === 'file' && entry.name.toLowerCase().endsWith('.md'))
                .map(entry => entry.name);
        }

        async function loadPosts() {
            const list = document.getElementById('blog-list');
            try {
                const names = await listMarkdownFiles();
                const posts = await Promise.all(names.map(async (name) => {
                    const response = await fetch('tpsiteitems/content/blogs/' + encodeURIComponent(name));
                    if (!response.ok) return null;
                    return parsePost(name, await response.text());
                }));
                allPosts = posts.filter(Boolean);
                renderBlog();
            } catch (error) {
                console.error(error);
                list.innerHTML = '<p class="blog-status">Posts could not be loaded.</p>';
            }
        }

        document.getElementById('blog-search').addEventListener('input', () => {
            currentPage = 1;
            renderBlog();
        });
        document.getElementById('blog-sort').addEventListener('change', () => {
            currentPage = 1;
            renderBlog();
        });
        document.getElementById('blog-asset-toggle').addEventListener('click', () => {
            assetMode = !assetMode;
            if (assetMode) renderAssets();
            applyAssetVisibility();
            if (!assetMode) renderBlog();
        });
        document.getElementById('asset-search').addEventListener('input', () => {
            renderAssets();
        });
        document.getElementById('blog-rail').innerHTML = promoMarkup('blog-ad-rail');
        loadPosts();
    </script>
</body>
</html>
