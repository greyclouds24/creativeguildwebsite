<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creative Guild Games — Blog</title>
    <link rel="stylesheet" href="styles.css?v=20261026b" />
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-inner">
            <div class="brand">
                <span class="brand-mark"></span>
                <span class="brand-text">Creative Guild LLC</span>
            </div>

            <nav class="nav-items">
                <a class="nav-item" href="index.html">Home</a>
                <a class="nav-item" href="our-games.html">Our Games</a>
                <a class="nav-item" href="about-us.html">About Us</a>
                <a class="nav-item active" href="blog.html">Blog</a>
            </nav>

            <div class="nav-actions">
                <button class="projects-btn" onclick="window.location.href='help-wanted.html'">
                    <strong>Ongoing Projects</strong>
                    <span>Apply to help us out!</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="profile-section">
            <h1 class="title-bordered">Blog</h1>
            <p class="subtitle">Notes from the studio</p>
        </section>

        <section class="portfolio" id="blog-panel">
            <div class="blog-tools">
                <label class="blog-search">
                    <span class="blog-tool-label">Search</span>
                    <input id="blog-search" type="search" placeholder="Search posts" autocomplete="off" />
                </label>
                <label class="blog-sort">
                    <span class="blog-tool-label">Date</span>
                    <select id="blog-sort">
                        <option value="newest">Newest</option>
                        <option value="oldest">Oldest</option>
                    </select>
                </label>
                <div class="blog-tag-filters" id="blog-tag-filters" aria-label="Filter by tag"></div>
            </div>
            <div class="blog-list" id="blog-list">
                <p class="blog-status">Loading posts...</p>
            </div>
            <nav class="blog-pager" id="blog-pager" aria-label="Blog pages" hidden></nav>
        </section>
    </main>

    <footer class="site-footer">
        <span class="site-version">v2.2</span>
    </footer>

    <script src="assets/marked.min.js"></script>
    <script>
        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const parts = String(dateString).split('-');
            if (parts.length < 3) return escapeHtml(dateString);
            const date = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
            if (Number.isNaN(date.getTime())) return escapeHtml(dateString);
            return date.toLocaleDateString(undefined, {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        const PAGE_SIZE = 10;
        let allPosts = [];
        let activeTag = '';
        let currentPage = 1;

        function tagLabel(tag) {
            return String(tag).replace(/-/g, ' ');
        }

        function postTags(post) {
            return Array.isArray(post.tags) ? post.tags.filter(Boolean) : [];
        }

        function postTime(post) {
            const time = Date.parse(post.datePublished);
            return Number.isNaN(time) ? 0 : time;
        }

        function postSearchText(post) {
            const content = document.createElement('div');
            content.innerHTML = post.content || '';
            return [
                post.title,
                post.excerpt,
                post.category,
                postTags(post).map(tagLabel).join(' '),
                content.textContent
            ].join(' ').toLowerCase();
        }

        function renderTagFilters() {
            const filters = document.getElementById('blog-tag-filters');
            const tags = [...new Set(allPosts.flatMap(postTags))].sort((a, b) =>
                tagLabel(a).localeCompare(tagLabel(b))
            );
            const chips = ['', ...tags].map((tag) => {
                const selected = tag === activeTag;
                const label = tag ? tagLabel(tag) : 'All';
                return `<button class="blog-tag-filter${selected ? ' active' : ''}" type="button" data-tag="${escapeHtml(tag)}" aria-pressed="${selected ? 'true' : 'false'}">${escapeHtml(label)}</button>`;
            });
            filters.innerHTML = chips.join('');
            filters.querySelectorAll('.blog-tag-filter').forEach((button) => {
                button.addEventListener('click', () => {
                    activeTag = button.dataset.tag || '';
                    currentPage = 1;
                    renderBlog();
                });
            });
        }

        function visiblePosts() {
            const query = document.getElementById('blog-search').value.trim().toLowerCase();
            const sort = document.getElementById('blog-sort').value;
            const posts = allPosts.filter((post) => {
                const matchesTag = !activeTag || postTags(post).some((tag) => tag.toLowerCase() === activeTag.toLowerCase());
                const matchesQuery = !query || postSearchText(post).includes(query);
                return matchesTag && matchesQuery;
            });
            posts.sort((a, b) => sort === 'oldest' ? postTime(a) - postTime(b) : postTime(b) - postTime(a));
            return posts;
        }

        function renderPager(total) {
            const pager = document.getElementById('blog-pager');
            const pageCount = Math.ceil(total / PAGE_SIZE);
            if (pageCount <= 1) {
                pager.hidden = true;
                pager.innerHTML = '';
                return;
            }

            const start = (currentPage - 1) * PAGE_SIZE + 1;
            const end = Math.min(total, currentPage * PAGE_SIZE);
            const pages = Array.from({ length: pageCount }, (_, index) => index + 1).map((page) => {
                const selected = page === currentPage;
                return `<button class="blog-page${selected ? ' active' : ''}" type="button" data-page="${page}" aria-current="${selected ? 'page' : 'false'}">${page}</button>`;
            }).join('');

            pager.hidden = false;
            pager.innerHTML = `
                <p class="blog-page-status">Showing ${start}–${end} of ${total}</p>
                <div class="blog-page-controls">
                    <button class="blog-page" type="button" data-page="${currentPage - 1}" ${currentPage === 1 ? 'disabled' : ''}>Previous</button>
                    ${pages}
                    <button class="blog-page" type="button" data-page="${currentPage + 1}" ${currentPage === pageCount ? 'disabled' : ''}>Next</button>
                </div>
            `;
            pager.querySelectorAll('.blog-page').forEach((button) => {
                button.addEventListener('click', () => {
                    if (button.disabled) return;
                    currentPage = Number(button.dataset.page);
                    renderBlog();
                    document.getElementById('blog-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
            });
        }

        function renderBlog() {
            renderTagFilters();
            const list = document.getElementById('blog-list');
            const posts = visiblePosts();
            const pageCount = Math.max(1, Math.ceil(posts.length / PAGE_SIZE));
            if (currentPage > pageCount) currentPage = pageCount;
            if (currentPage < 1) currentPage = 1;
            if (!allPosts.length) {
                list.innerHTML = '<p class="blog-status">Nothing published yet.</p>';
                renderPager(0);
                return;
            }
            if (!posts.length) {
                list.innerHTML = '<p class="blog-status">No posts match that search.</p>';
                renderPager(0);
                return;
            }

            const pagePosts = posts.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
            list.innerHTML = pagePosts.map((post, index) => {
                const tags = postTags(post);
                const meta = [
                    formatDate(post.datePublished),
                    post.category,
                    post.readTime
                ].filter(Boolean).map(escapeHtml).join(' · ');

                return `
                    <article class="blog-card" id="post-${escapeHtml(post.id || index)}">
                        <div class="blog-card-header">
                            <div>
                                <h2>${escapeHtml(post.title || 'Untitled')}</h2>
                                <p class="blog-meta">${meta}</p>
                            </div>
                            <button class="blog-toggle" type="button" aria-expanded="false">Read</button>
                        </div>
                        ${tags.length ? `<div class="blog-tags">${tags.map((tag) => `<button class="blog-tag" type="button" data-tag="${escapeHtml(tag)}">${escapeHtml(tagLabel(tag))}</button>`).join('')}</div>` : ''}
                        <p class="blog-excerpt">${escapeHtml(post.excerpt || '')}</p>
                        <div class="blog-body">
                            ${post.content || ''}
                            <button class="blog-toggle blog-close" type="button">Close</button>
                        </div>
                    </article>
                `;
            }).join('');
            renderPager(posts.length);

            function setPostOpen(card, open) {
                card.classList.toggle('expanded', open);
                const toggle = card.querySelector('.blog-card-header .blog-toggle');
                if (toggle) {
                    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
                    toggle.textContent = open ? 'Close' : 'Read';
                }
            }

            function closePost(card) {
                setPostOpen(card, false);
                requestAnimationFrame(() => {
                    document.getElementById('blog-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
            }

            list.querySelectorAll('.blog-card-header .blog-toggle').forEach((button) => {
                button.addEventListener('click', () => {
                    const card = button.closest('.blog-card');
                    if (card.classList.contains('expanded')) closePost(card);
                    else setPostOpen(card, true);
                });
            });

            list.querySelectorAll('.blog-close').forEach((button) => {
                button.addEventListener('click', () => {
                    closePost(button.closest('.blog-card'));
                });
            });

            list.querySelectorAll('.blog-tag').forEach((button) => {
                button.addEventListener('click', () => {
                    activeTag = button.dataset.tag || '';
                    currentPage = 1;
                    renderBlog();
                });
            });
        }

        function wordCount(text) {
            const plain = String(text || '').replace(/<[^>]*>/g, ' ').trim();
            if (!plain) return 0;
            return plain.split(/\s+/).filter(Boolean).length;
        }

        function readingTime(words) {
            const count = Math.max(0, Number(words) || 0);
            const fast = Math.max(1, Math.ceil(count / 238));
            const slow = Math.max(1, Math.ceil(count / 200));
            if (fast === slow) return `${fast} min read`;
            return `${fast}–${slow} min read`;
        }

        function excerptFrom(html) {
            const plain = String(html || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
            if (plain.length <= 150) return plain;
            const cut = plain.slice(0, 150);
            const lastSpace = cut.lastIndexOf(' ');
            return (lastSpace > 0 ? cut.slice(0, lastSpace) : cut) + '...';
        }

        function markdownToHtml(markdown) {
            const html = marked.parse(markdown, { gfm: true, breaks: false });
            return html
                .replace(/<table>/g, '<table class="blog-table">')
                .replace(/<blockquote>/g, '<blockquote class="blog-quote">')
                .replace(/<code>/g, '<code class="blog-code-inline">');
        }

        function parsePost(filename, markdown) {
            const lines = String(markdown || '').replace(/^\uFEFF/, '').split(/\r?\n/);
            const frontmatter = {};
            let bodyStart = 0;

            if (lines[0] && lines[0].trim() === '---') {
                let end = -1;
                for (let i = 1; i < lines.length; i++) {
                    if (lines[i].trim() === '---') {
                        end = i;
                        break;
                    }
                    const line = lines[i].trim();
                    if (!line || line.startsWith('#') || !line.includes(':')) continue;
                    const colon = line.indexOf(':');
                    const key = line.slice(0, colon).trim();
                    let value = line.slice(colon + 1).trim();
                    if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
                        value = value.slice(1, -1);
                    }
                    if (value.startsWith('[') && value.endsWith(']')) {
                        value = value.slice(1, -1).split(',').map(item => item.trim().replace(/['"]/g, '')).filter(Boolean);
                    } else if (value === 'true') {
                        value = true;
                    } else if (value === 'false') {
                        value = false;
                    } else if (value !== '' && !Number.isNaN(Number(value))) {
                        value = Number(value);
                    }
                    frontmatter[key] = value;
                }
                if (end >= 0) bodyStart = end + 1;
            }

            const body = lines.slice(bodyStart).join('\n').trim();
            if (!wordCount(body)) return null;

            const content = markdownToHtml(body);
            const words = wordCount(content);
            const id = filename.replace(/\.md$/i, '').toLowerCase().replace(/[^a-z0-9]/g, '-');
            return {
                id,
                title: id,
                datePublished: new Date().toISOString().slice(0, 10),
                category: 'General',
                tags: [],
                ...frontmatter,
                wordCount: words,
                readTime: readingTime(words),
                excerpt: frontmatter.excerpt || excerptFrom(content),
                content
            };
        }

        async function listMarkdownFiles() {
            try {
                const response = await fetch('tpsiteitems/content/blogs/');
                if (response.ok) {
                    const listing = await response.text();
                    const names = [...listing.matchAll(/href="([^"]+)"/gi)]
                        .map(match => decodeURIComponent(match[1].split('/').pop().split('?')[0]))
                        .filter(name => name.toLowerCase().endsWith('.md'));
                    const unique = [...new Set(names)];
                    if (unique.length) return unique;
                }
            } catch (error) {
                console.warn(error);
            }

            const response = await fetch('https://api.github.com/repos/greyclouds24/creativeguildwebsite/contents/tpsiteitems/content/blogs', {
                headers: { Accept: 'application/vnd.github+json' }
            });
            if (!response.ok) throw new Error('Could not list blog posts');
            const entries = await response.json();
            return entries
                .filter(entry => entry.type === 'file' && entry.name.toLowerCase().endsWith('.md'))
                .map(entry => entry.name);
        }

        async function loadPosts() {
            const list = document.getElementById('blog-list');
            try {
                const names = await listMarkdownFiles();
                const posts = await Promise.all(names.map(async (name) => {
                    const response = await fetch('tpsiteitems/content/blogs/' + encodeURIComponent(name));
                    if (!response.ok) return null;
                    return parsePost(name, await response.text());
                }));
                allPosts = posts.filter(Boolean);
                renderBlog();
            } catch (error) {
                console.error(error);
                list.innerHTML = '<p class="blog-status">Posts could not be loaded.</p>';
            }
        }

        document.getElementById('blog-search').addEventListener('input', () => {
            currentPage = 1;
            renderBlog();
        });
        document.getElementById('blog-sort').addEventListener('change', () => {
            currentPage = 1;
            renderBlog();
        });
        loadPosts();
    </script>
</body>
</html>
