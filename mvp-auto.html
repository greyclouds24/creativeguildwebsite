<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creative Guild Games - MVP Auto</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
        .game-shell {
            width: min(1400px, 100%);
            margin: 0 auto;
        }

        .game-frame {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 0;
            border-radius: 12px;
            background: #000;
        }

    </style>
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-inner">
            <div class="brand">
                <span class="brand-mark"></span>
                <span class="brand-text">Creative Guild LLC</span>
            </div>

            <nav class="nav-items">
                <a class="nav-item" href="index.html">Home</a>
                <a class="nav-item active" href="our-games.html">Our Games</a>
                <a class="nav-item" href="about-us.html">About Us</a>
            </nav>

            <div class="nav-actions">
                <button class="projects-btn" onclick="window.location.href='help-wanted.html'">
                    <strong>Ongoing Projects</strong>
                    <span>Apply to help us out!</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="profile-section">
            <h1 class="title-bordered">MVP Auto</h1>
            <p class="subtitle">Godot Web Build</p>
            <p class="bio">
                This page hosts the browser export of the MVP Auto prototype.
            </p>
        </section>

        <section class="game-shell">
            <iframe
                class="game-frame"
                title="MVP Auto"
                src="./games/mvp-auto/index.html"
                allowfullscreen
            ></iframe>
        </section>
    </main>

    <footer class="site-footer">
        <span class="site-version">v2.5.3</span>
    </footer>
</body>
</html>
