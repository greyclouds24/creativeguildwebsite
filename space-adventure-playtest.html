<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Creative Guild Games — Space Adventure One</title>
	<link rel="stylesheet" href="styles.css" />
	<style>
		/* Wider stage than default .container for a landscape game embed */
		main.sa-playtest-main {
			max-width: none;
			width: 100%;
			box-sizing: border-box;
			padding: 0 1rem 2rem;
		}
		.sa-playtest-stage {
			width: min(96vw, 1680px);
			margin: 0.75rem auto 0;
		}
		.sa-playtest-toolbar {
			display: flex;
			justify-content: flex-end;
			align-items: center;
			gap: 0.5rem;
			margin-bottom: 0.5rem;
		}
		.sa-playtest-toolbar button {
			font: inherit;
			cursor: pointer;
			padding: 0.45rem 1rem;
			border-radius: 6px;
			border: 1px solid rgba(255, 255, 255, 0.25);
			background: rgba(255, 255, 255, 0.08);
			color: inherit;
		}
		.sa-playtest-toolbar button:hover {
			background: rgba(255, 255, 255, 0.14);
		}
		.sa-playtest-frame {
			position: relative;
			width: 100%;
			border-radius: 10px;
			overflow: hidden;
			border: 1px solid rgba(255, 255, 255, 0.12);
			background: #0a0a0f;
			min-height: min(82vh, 960px);
		}
		.sa-playtest-frame iframe {
			display: block;
			width: 100%;
			min-height: min(82vh, 960px);
			border: 0;
			vertical-align: top;
		}
	</style>
</head>
<body>
	<header class="top-bar">
		<div class="top-bar-inner">
			<div class="brand">
				<span class="brand-mark"></span>
				<span class="brand-text">Creative Guild LLC</span>
			</div>

			<nav class="nav-items">
				<a class="nav-item" href="index.html">Home</a>
				<a class="nav-item" href="our-games.html">Our Games</a>
				<a class="nav-item" href="about-us.html">About Us</a>
			</nav>

			<div class="nav-actions">
				<button class="projects-btn" onclick="window.location.href='help-wanted.html'">
					<strong>Ongoing Projects</strong>
					<span>Apply to help us out!</span>
				</button>
			</div>
		</div>
	</header>

	<main class="container sa-playtest-main">
		<section class="profile-section">
			<h1 class="title-bordered">Space Adventure One</h1>
			<p class="subtitle">In-browser preview</p>
		</section>

		<section class="sa-playtest-stage" aria-label="Game embed">
			<div class="sa-playtest-toolbar">
				<button type="button" id="sa1-fullscreen">Fullscreen</button>
			</div>
			<div class="sa-playtest-frame">
				<iframe
					id="sa1-game-iframe"
					src="./games/space-adventure-one/index.html"
					title="Space Adventure One"
					allow="autoplay; fullscreen; gamepad"
					allowfullscreen
				></iframe>
			</div>
		</section>
	</main>

	<footer class="site-footer">
		<span class="site-version">v3.5</span>
	</footer>

	<script>
		(function () {
			var frame = document.getElementById("sa1-game-iframe");
			var btn = document.getElementById("sa1-fullscreen");
			if (!frame || !btn) return;

			function isFs() {
				return !!(document.fullscreenElement || document.webkitFullscreenElement);
			}

			function syncLabel() {
				btn.textContent = isFs() ? "Exit fullscreen" : "Fullscreen";
			}

			btn.addEventListener("click", function () {
				if (!isFs()) {
					var el = frame;
					var req =
						el.requestFullscreen ||
						el.webkitRequestFullscreen ||
						el.mozRequestFullScreen ||
						el.msRequestFullscreen;
					if (req) req.call(el);
				} else {
					var ex =
						document.exitFullscreen ||
						document.webkitExitFullscreen ||
						document.mozCancelFullScreen ||
						document.msExitFullscreen;
					if (ex) ex.call(document);
				}
			});

			document.addEventListener("fullscreenchange", syncLabel);
			document.addEventListener("webkitfullscreenchange", syncLabel);
			syncLabel();
		})();
	</script>
</body>
</html>
