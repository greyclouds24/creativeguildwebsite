<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Creative Guild Games — Space Adventure One</title>
	<link rel="stylesheet" href="styles.css" />
	<style>
		.playtest-wrap { margin-top: 1.5rem; }
		.playtest-wrap iframe {
			display: block;
			width: 100%;
			min-height: min(720px, 85vh);
			border: 1px solid rgba(255, 255, 255, 0.12);
			border-radius: 8px;
			background: #0a0a0f;
		}
	</style>
</head>
<body>
	<header class="top-bar">
		<div class="top-bar-inner">
			<div class="brand">
				<span class="brand-mark"></span>
				<span class="brand-text">Creative Guild LLC</span>
			</div>

			<nav class="nav-items">
				<a class="nav-item" href="index.html">Home</a>
				<a class="nav-item" href="our-games.html">Our Games</a>
				<a class="nav-item" href="about-us.html">About Us</a>
			</nav>

			<div class="nav-actions">
				<button class="projects-btn" onclick="window.location.href='help-wanted.html'">
					<strong>Ongoing Projects</strong>
					<span>Apply to help us out!</span>
				</button>
			</div>
		</div>
	</header>

	<main class="container">
		<section class="profile-section">
			<h1 class="title-bordered">Space Adventure One</h1>
			<p class="subtitle">In-browser preview</p>
		</section>

		<section class="playtest-wrap">
			<iframe
				src="./games/space-adventure-one/index.html"
				title="Space Adventure One"
				allow="autoplay; fullscreen; gamepad"
			></iframe>
		</section>
	</main>

	<footer class="site-footer">
		<span class="site-version">v3.0</span>
	</footer>
</body>
</html>
